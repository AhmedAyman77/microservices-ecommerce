server:
  port: 8080

jwt:
  secret: cd299572df97cc613947b36ff80231d512d314f799401b816e06ae30d2c850a2

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/auth/**,/users/**
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/products/**,/categories/**
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/cart/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30